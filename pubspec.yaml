name: builder_pro_mobile
description: "ownit2buildit mobile app for construction teams"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.3
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1
  socket_io_client: ^3.1.6
  intl: ^0.20.3
  image_picker: ^1.2.4
  connectivity_plus: ^7.3.2
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  geolocator: ^14.0.1
  file_picker: ^13.3.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  record: ^7.1.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  mocktail: ^1.0.5
flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
